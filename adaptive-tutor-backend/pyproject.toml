[project]
name = "adaptive-tutor-backend"
version = "0.1.0"
description = "Adaptive tutoring system backend for neurodivergent learners"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.1",
    "pydantic-settings==2.7.0",
    "groq==0.13.1",
    "sentry-sdk[fastapi]==2.19.2",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "supabase>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
    "factory-boy==3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
